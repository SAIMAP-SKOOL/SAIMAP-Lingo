# Compila la app Android (TWA) de SAIMAP Lingo sin firmar y deja el resultado en la rama "android-build".
# La firma se hace fuera de GitHub con la clave de subida, que no está en el repositorio.
name: App Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Compilar AAB y APK
        working-directory: android/twa
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease 2>&1 | tee ../../build.log
      - name: Publicar en la rama android-build
        if: always()
        run: |
          mkdir out
          cp build.log out/ || true
          cp android/twa/app/build/outputs/bundle/release/app-release.aab out/ || true
          cp android/twa/app/build/outputs/apk/release/app-release-unsigned.apk out/ || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" "$BT/zipalign" out/ || true
          echo "${GITHUB_SHA} ${{ job.status }}" > out/estado.txt
          cd out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Compilación ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
