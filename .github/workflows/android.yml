# Compila la app Android (TWA) de SAIMAP Lingo sin firmar.
# La firma se hace fuera de GitHub con la clave de subida, que no está en el repositorio.
name: App Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Compilar AAB y APK
        working-directory: android/twa
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Reunir resultados y herramientas de firma
        run: |
          mkdir out
          cp android/twa/app/build/outputs/bundle/release/app-release.aab out/
          cp android/twa/app/build/outputs/apk/release/app-release-unsigned.apk out/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" "$BT/zipalign" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: saimap-lingo-android-sin-firmar
          path: out/
          retention-days: 30
