<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAIMAP Lingo</title>
<meta name="description" content="SAIMAP Lingo: aprende italiano, inglés, portugués, francés y alemán desde cero con lecciones cortas y repaso continuo.">
<meta name="theme-color" content="#1F5FD1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: columna estrecha tipo móvil; tarjeta de bienvenida con la mascota, y un camino de módulos en zigzag con un color por unidad. */
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --sunken:#E7ECF6; --ink:#14213A; --muted:#566381; --line:#D5DDEC;
  --brand:#1F5FD1; --brand-deep:#17489F; --brand-ink:#FFFFFF; --brand-soft:#DCE8FC;
  --sun:#F5B81F; --sun-deep:#C58F07; --sun-ink:#3A2A00; --sun-soft:#FFF1C9;
  --ok:#17875A; --ok-bg:#DAF3E7; --bad:#C93A32; --bad-bg:#FBE2DF;
  --u1:#1F5FD1; --u1d:#17489F; --u2:#178A5C; --u2d:#10653F; --u3:#D5503F; --u3d:#A5382B; --u4:#7650CC; --u4d:#57379E; --u5:#0D8799; --u5d:#096473; --uink:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#172238; --sunken:#111B2E; --ink:#EAF0FA; --muted:#9DABC4; --line:#2B3956;
  --brand:#5B93F5; --brand-deep:#3B6ED0; --brand-ink:#07122A; --brand-soft:#1C2E52;
  --sun:#FFCB4D; --sun-deep:#B88A12; --sun-ink:#2E2100; --sun-soft:#3A3013;
  --ok:#43CE95; --ok-bg:#12382B; --bad:#F2837B; --bad-bg:#40201E;
  --u1:#5B93F5; --u1d:#3B6ED0; --u2:#43CE95; --u2d:#2B9A6C; --u3:#F2837B; --u3d:#C2574F; --u4:#A98BEF; --u4d:#7C5FC4; --u5:#4CC6D8; --u5d:#2F97A7; --uink:#07122A;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#172238; --sunken:#111B2E; --ink:#EAF0FA; --muted:#9DABC4; --line:#2B3956;
  --brand:#5B93F5; --brand-deep:#3B6ED0; --brand-ink:#07122A; --brand-soft:#1C2E52;
  --sun:#FFCB4D; --sun-deep:#B88A12; --sun-ink:#2E2100; --sun-soft:#3A3013;
  --ok:#43CE95; --ok-bg:#12382B; --bad:#F2837B; --bad-bg:#40201E;
  --u1:#5B93F5; --u1d:#3B6ED0; --u2:#43CE95; --u2d:#2B9A6C; --u3:#F2837B; --u3d:#C2574F; --u4:#A98BEF; --u4d:#7C5FC4; --u5:#4CC6D8; --u5d:#2F97A7; --uink:#07122A;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:700 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding-inline:16px;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.it{font-family:var(--display)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;line-height:1}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px}
.brand{font:800 20px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand i{font-style:normal;color:var(--brand)}
.cbadge{font:800 11px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
.brand svg{width:34px;height:36px;flex:none}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.stat svg{width:16px;height:16px}
.stat.fire svg{color:var(--sun-deep)} .stat.xp svg{color:var(--brand)}
.stat.lit{background:var(--sun-soft);border-color:var(--sun)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;overflow:hidden;border:2px solid var(--line);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover} .avatar svg{width:18px;height:18px}

/* bienvenida */
.hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);margin-block:6px 4px}
.hero>svg{width:86px;height:94px;flex:none}
.hero>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:23px}.hero p{color:var(--muted);font-size:15px}
.goal{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.goal .meter{flex:1;min-width:0}.goal span{flex:none}.goal .meter i{background:var(--sun)}
.meter{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.speakrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);margin-top:10px;font:700 14.5px/1.25 var(--body,inherit)}
.speakrow>span{display:flex;align-items:center;gap:10px;min-width:0}.speakrow>span>svg{width:22px;height:22px;flex:none;color:var(--brand)}
.speakrow small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.daily{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;margin-top:10px;background:linear-gradient(135deg,var(--sun-soft),var(--surface));border:2px solid var(--sun);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,transparent)}
.daily.done{border-color:var(--line);box-shadow:0 4px 0 var(--line);background:var(--surface)}
.daily .dico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink)}
.daily.done .dico{background:var(--line);color:var(--ink)}.daily .dico svg{width:24px;height:24px}
.daily>div{flex:1;min-width:0}.daily b{font:800 17px/1.2 var(--display)}.daily p{color:var(--muted);font-size:14px;margin-top:2px}
.speak{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
.mic{width:96px;height:96px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 0 var(--brand-deep);cursor:pointer;transition:transform .12s}
.mic svg{width:44px;height:44px}.mic:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brand-deep)}
.mic.on{background:#E2574C;box-shadow:0 0 0 0 rgba(226,87,76,.55);animation:micpulse 1.2s infinite}
.mic:disabled{opacity:.5;cursor:default;animation:none}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(226,87,76,.55)}70%{box-shadow:0 0 0 22px rgba(226,87,76,0)}100%{box-shadow:0 0 0 0 rgba(226,87,76,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:24px;text-align:center;color:var(--muted);font-weight:700;font-size:15.5px;max-width:34ch}
.heard.err{color:#C0392B}
.skips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}.skips .btn{flex:1 1 140px}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--sun-soft);font-size:14.5px;margin-top:10px}
.notice span{min-width:0;flex:1 1 180px}
.level{display:flex;align-items:center;gap:12px;padding-block:22px 2px}
.level b{font:800 13px/1 var(--display);letter-spacing:.06em;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--bg);flex:none}
.level h2{font-size:22px;flex:0 1 auto;min-width:0}.level .meter{flex:1;min-width:40px}
.level small{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* unidad y camino */
.unit{padding-block:12px 4px;display:flex;flex-direction:column;gap:6px;--uc:var(--u1);--ucd:var(--u1d)}
.unit.c2{--uc:var(--u2);--ucd:var(--u2d)}.unit.c3{--uc:var(--u3);--ucd:var(--u3d)}.unit.c4{--uc:var(--u4);--ucd:var(--u4d)}.unit.c5{--uc:var(--u5);--ucd:var(--u5d)}
.uhead{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--uc);color:var(--uink);box-shadow:0 5px 0 var(--ucd)}
.uhead.locked{background:var(--sunken);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.uhead .badge{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--uink) 22%,transparent);display:grid;place-items:center;font-size:30px;flex:none}
.uhead.locked .badge{filter:grayscale(1);opacity:.6}
.uhead div{min-width:0;flex:1}
.uhead small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;opacity:.9}
.uhead h2{font-size:21px}
.uhead p{font-size:14px;opacity:.92}
.ghost{flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:14px;background:color-mix(in srgb,currentColor 18%,transparent)}
.ghost svg{width:16px;height:16px}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:22px 14px;--dx:54px}
.unit.flip .path{--dx:-54px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;position:relative}
.node:nth-of-type(2){transform:translateX(var(--dx))}.node:nth-of-type(3){transform:translateX(calc(var(--dx)*1.5))}.node:nth-of-type(4){transform:translateX(var(--dx))}
.disc{width:74px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted);box-shadow:0 7px 0 var(--line);transition:transform .08s,box-shadow .08s}
.disc svg{width:28px;height:28px}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.node.open .disc{background:var(--uc);color:var(--uink);box-shadow:0 7px 0 var(--ucd)}
.node.done .disc{background:var(--sun);color:var(--sun-ink);box-shadow:0 7px 0 var(--sun-deep)}
.node.now{margin-top:26px}.node.now.done{margin-top:0}
.node.now .disc{animation:bob 1.6s ease-in-out infinite}
.node.now::before{content:"Empieza";position:absolute;top:-30px;padding:5px 10px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font:800 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--uc);animation:bob 1.6s ease-in-out infinite}
.node.now.done::before{content:none}
.node b{font:600 14px/1.2 var(--display);text-align:center}
.path.scn{position:relative;margin-top:8px;border-radius:24px;overflow:hidden;background:var(--tint);padding-block:26px 18px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 8%,transparent)}
.path.scn .scene{position:absolute;inset:0;z-index:0}
.path.scn .scene svg{display:block;width:100%;height:100%}
.path.scn svg.road{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.path.scn .node{z-index:1}
.path.scn .node b{background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 9px;border-radius:10px;box-shadow:0 1px 3px rgba(20,33,58,.12)}
.path.scn .node.shut .disc{background:color-mix(in srgb,var(--surface) 92%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .path.scn .scene,:root:not([data-theme="light"]) .path.scn svg.road{filter:brightness(.62) saturate(.9)}}
:root[data-theme="dark"] .path.scn .scene,:root[data-theme="dark"] .path.scn svg.road{filter:brightness(.62) saturate(.9)}
.node.shut b{color:var(--muted)}
.stars{display:flex;gap:2px;height:13px}.stars svg{width:13px;height:13px;color:var(--line)}.stars svg.on{color:var(--sun-deep)}
.foot{padding-block:20px 28px;color:var(--muted);font-size:14px;text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.moka .steam{animation:steam 2.4s ease-out infinite}.moka .steam.b{animation-delay:1.1s}

/* botones */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font:800 16px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.btn[disabled]{background:var(--sunken);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.btn.plain{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.good{background:var(--ok);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.btn.warn{background:var(--bad);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.small{width:auto;padding:11px 16px;font-size:14px;align-self:flex-start}

/* hoja inferior */
.veil{position:fixed;inset:0;z-index:20;background:rgba(8,14,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .22s ease-out}
.sheet h2{font-size:24px}.sheet h3{font-size:17px}
.sub{color:var(--muted)}
.tip{padding:12px 14px;border-radius:16px;background:var(--brand-soft);font-size:15px}
.tip b{display:block;font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--brand)}
.pic{border-radius:16px;border:2px solid var(--line);width:100%;height:auto}
.words{display:grid;grid-template-columns:auto auto 1fr 1fr;gap:0 10px;font-size:15px;align-items:center}
.words>*{padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.words .es{color:var(--muted)}.words .emo{font-size:20px;min-width:22px;text-align:center}
.say{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--brand);background:var(--brand-soft);flex:none}
.say svg{width:16px;height:16px}
.sheethead{display:flex;gap:12px;align-items:center}.sheethead .emo{font-size:40px}.sheethead div{min-width:0}

/* lección */
.lesson{flex:1;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lbar{display:flex;align-items:center;gap:10px;padding-block:14px}
.lbar .meter{flex:1;height:16px}.lbar .meter i{background:var(--ok)}
.combo{font:800 13px/1 var(--display);padding:6px 9px;border-radius:99px;background:var(--sun);color:var(--sun-ink);display:flex;gap:4px;align-items:center;animation:pop .3s}
.combo svg{width:13px;height:13px}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}.x svg{width:20px;height:20px}
.lbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px 20px;animation:pop .25s}
.chip{align-self:flex-start;font:800 11.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:var(--sun);color:var(--sun-ink)}
.ask{font-size:22px}
.cue{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line)}
.cue .t{font:600 22px/1.25 var(--display);min-width:0;overflow-wrap:anywhere;flex:1}
.cue .t small{display:block;font:700 14.5px/1.3 var(--body);color:var(--muted);margin-top:4px}
.cue>.emo{font-size:44px;flex:none}
.cue.big{justify-content:center;padding:22px}.cue.big>.emo{font-size:88px}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand)}
.bigsay{width:76px;height:76px;border-radius:22px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 5px 0 var(--brand-deep);flex:none}
.bigsay svg{width:34px;height:34px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:700;display:flex;gap:12px;align-items:center;overflow-wrap:anywhere;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt kbd{font:800 12px/1 var(--body);color:var(--muted);border:2px solid var(--line);border-radius:7px;padding:4px 6px;flex:none}
.opt .emo{font-size:22px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 0 var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok);animation:pop .3s}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt.gone{opacity:.3;pointer-events:none}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{justify-content:center;text-align:center;min-height:56px}
.opts.pics{grid-template-columns:1fr 1fr}
.opts.pics .opt{justify-content:center;padding:18px 8px;position:relative}
.opts.pics .opt .emo{font-size:64px}
.opts.pics .opt kbd{position:absolute;top:8px;left:8px}
.line{min-height:62px;padding:8px 0;border-block:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border-radius:13px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font:600 17px/1 var(--display)}
.line .tile{animation:pop .18s}
.tile.used{visibility:hidden}
.field{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px/1.2 var(--display)}
.keys{display:flex;gap:8px;flex-wrap:wrap}.keys button{width:42px;height:42px;border-radius:11px;border:2px solid var(--line);background:var(--surface);font:600 18px/1 var(--display)}
.lfoot{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent;animation:rise .2s ease-out}.lfoot.bad{background:var(--bad-bg);border-color:transparent;animation:rise .2s ease-out}
.verdict{display:flex;gap:12px;align-items:center}
.verdict svg{width:52px;height:57px;flex:none}
.verdict div{min-width:0;display:flex;flex-direction:column;gap:2px}
.verdict b{font:800 20px/1.2 var(--display)}
.lfoot.ok .verdict b{color:var(--ok)}.lfoot.bad .verdict b{color:var(--bad)}
.verdict span{overflow-wrap:anywhere}
.intro{display:flex;gap:12px;align-items:center}.intro svg{width:70px;height:76px;flex:none}.intro div{min-width:0}

/* resultado y cuenta */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding-block:28px;position:relative}
.center>*{position:relative;z-index:1}
.center>svg{width:150px;height:163px}
.center h1{font-size:32px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tilebox{padding:14px 8px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:center;min-width:0}
.tilebox b{display:block;font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tilebox small{color:var(--muted);font-size:13px}
.bigstars{display:flex;gap:8px}.bigstars svg{width:46px;height:46px;color:var(--line)}.bigstars svg.on{color:var(--sun);animation:pop .5s backwards}.bigstars svg.on:nth-child(2){animation-delay:.15s}.bigstars svg.on:nth-child(3){animation-delay:.3s}
.card{padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:12px}.who .avatar{width:52px;height:52px}.who div{min-width:0}.who b{font:800 19px/1.2 var(--display);display:block;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row span{min-width:0}.row small{display:block;color:var(--muted);font-size:13.5px}
.switch{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--brand)}.switch[aria-checked="true"]::after{transform:translateX(22px)}
.pick{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.form{display:flex;flex-direction:column;gap:10px}.form input{padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--body);width:100%}
.err{color:var(--bad);font-size:14.5px}
.back{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--brand);padding-block:14px}.back svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(520px,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14.5px;animation:pop .25s}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* plataforma: botón de idioma y pantalla de idiomas */
.langbtn{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font:800 12px/1 var(--display);letter-spacing:.05em;flex:none}
.langbtn .flag{width:24px;height:16px}
.flag{display:block;flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(20,33,58,.12)}
html.langs-open,html.langs-open body{overflow:hidden}
.langs{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.langs-in{max-width:560px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:14px}
.langs-top{display:flex;align-items:center;gap:8px;padding-block:4px}
.langs-brand{font:800 20px/1 var(--display);margin-right:auto}.langs-brand i{font-style:normal;color:var(--brand)}
.langs-x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line)}.langs-x svg{width:18px;height:18px}
.langs h1{font-size:clamp(26px,7vw,34px);margin-top:6px}
.langs-sub{color:var(--muted);font-size:15px;max-width:46ch}
.langs-list{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.lang{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .1s}
.lang:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.lang .flag{width:54px;height:36px;border-radius:6px}
.lang.here{border-color:var(--brand);box-shadow:0 5px 0 var(--brand-deep)}
.lang-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lang-txt b{font:800 19px/1.15 var(--display)}.lang-txt small{color:var(--muted);font-size:13.5px}
.lang-prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.lang-prog em{font:800 11px/1 var(--display);font-style:normal;letter-spacing:.05em;padding:4px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand)}
.lang-prog .meter{flex:1;min-width:0}
.lang-go{flex:none;font:800 13px/1 var(--display);padding:9px 12px;border-radius:12px;background:var(--brand);color:var(--brand-ink)}
.lang.here .lang-go{background:var(--brand-soft);color:var(--brand)}
@media (max-width:380px){.lang-go{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="veil" class="veil" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="courses.js"></script>
<script src="platform.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>

</body>
</html>
